[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coda"
version = "0.1.0"
description = "Lightweight local coding-agent harness with controlled tools, layered memory, checkpoint/resume, and evaluation artifacts"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
coda = "coda.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "ruff>=0.4.4",
]

[tool.setuptools]
packages = ["coda"]
